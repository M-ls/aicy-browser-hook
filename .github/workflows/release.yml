name: Publish signed APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v1.0.10)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'M-ls/aicy-browser-hook'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, version and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Tag must be vMAJOR.MINOR.PATCH.' }
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Version tag does not exist.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to main.' }
          [xml]$manifest = Get-Content -LiteralPath project/AndroidManifest.xml -Raw
          $version = $manifest.manifest.GetAttribute('versionName', 'http://schemas.android.com/apk/res/android')
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match Android versionName.' }
          $notes = Get-Content -LiteralPath RELEASE.md -Raw
          if ($notes -notmatch "(?m)^# $([regex]::Escape($version)) 发布说明\s*$") { throw 'RELEASE.md must describe this version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Cache verified SDK downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/aicy-hook-build/platform-35_r02.zip
            work/aicy-hook-build/build-tools_r35_linux.zip
            work/aicy-hook-build/xposed-api-82.jar
          key: android-sdk-${{ runner.os }}-${{ hashFiles('project/prepare-dependencies.ps1') }}
      - name: Build, sign and verify APK
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: aicy-local
          SIGNING_CERT_SHA256: 6d12194bb7ae583fc0facdc7a1038a6139beb5e459aaeb9f33bd60dfb2042d61
        run: |
          if (-not $env:SIGNING_KEYSTORE_BASE64) { throw 'Signing keystore secret is missing.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'aicy-release-signing.jks'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64))
            chmod 600 $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not restrict keystore permissions.' }
            Remove-Item Env:SIGNING_KEYSTORE_BASE64
            ./build.ps1 -Release -SigningKeyPath $keyPath
          } finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }
      - name: Package release assets
        shell: pwsh
        run: |
          $apk = "AicyBrowserHook-$env:RELEASE_TAG.apk"
          $source = "AicyBrowserHook-$env:RELEASE_TAG-GitHub-source.zip"
          Copy-Item -LiteralPath dist/AicyBrowserHook.apk -Destination "dist/$apk"
          git archive --format=zip --output="dist/$source" "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          $checksums = foreach ($name in $apk, $source) {
            "$((Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=("dist/AicyBrowserHook-$RELEASE_TAG.apk" "dist/AicyBrowserHook-$RELEASE_TAG-GitHub-source.zip" "dist/SHA256SUMS.txt")
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/aicy-release-state"; then
            [[ "$(cat "$RUNNER_TEMP/aicy-release-state")" == true ]] || { echo 'This version is already published. Create a new version tag.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Aicy Browser Hook $RELEASE_TAG" --notes-file RELEASE.md --draft=false --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "Aicy Browser Hook $RELEASE_TAG" --notes-file RELEASE.md --latest
          fi
